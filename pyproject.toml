[project]
name = "email-verifier"
version = "1.0.0"
description = "Verify email addresses over SMTP, with catch-all detection and a bulk upload interface."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jan Alexandr Kopřiva", email = "jan.alexandr.kopriva@gmail.com" }]
keywords = ["email", "verification", "smtp", "dns", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
]
dependencies = [
    "aiosmtplib>=5.1.1",
    "aiodns>=3.1",
    "email-validator>=2.0",
    "flask>=3.1.3",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.16.1"]

[project.urls]
Homepage = "https://github.com/koprjaa/email-verifier"
Repository = "https://github.com/koprjaa/email-verifier"
Issues = "https://github.com/koprjaa/email-verifier/issues"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RET", "PTH", "TRY", "PERF", "RUF"]
# E501  line length is handled by the formatter, not worth failing CI over
# TRY003 wants one exception subclass per message. That is ceremony for a
#        message a reader needs, so informative raises stay.
ignore = [
    "E501",    # line length is handled by the formatter
    "TRY003",  # one exception subclass per message is ceremony
    # The SMTP exchange in verifier/email_verifier.py raises inside its own try
    # so one handler can turn any step of the conversation into a verdict.
    # Hoisting those raises would scatter the protocol across helpers.
    "TRY301",
    # The value returned is what the log line above it just described. Moving it
    # into an else block separates the two.
    "TRY300",
    # Each of these guards a single network call. The cost is the request.
    "PERF203",
    # N818 wants an Error suffix on the base exception. Renaming a public class
    # for a naming convention breaks every importer for nothing.
    "N818",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
addopts = "-q --strict-markers"

[tool.uv]
package = false
