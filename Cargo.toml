[package]
name = "email-verifier"
version = "1.0.0"
edition = "2021"
description = "Checks whether email addresses exist, one by one or in bulk."
license = "MIT"
authors = ["Jan Alexandr Kopřiva"]
repository = "https://github.com/koprjaa/email-verifier"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "sync", "time", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
csv = "1"
encoding_rs = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hickory-resolver = { version = "0.24", features = ["tokio-runtime", "system-config"] }
hostname = "0.4"
idna = "1"
unicode-normalization = "0.1"
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
